<meta name="description" content="Short-form sports, event and behind-the-scenes video reels by 31 ACTION Photography.">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="reels-page">
<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-main"><span class="n">31</span><span class="a">ACTION</span></span>
    <span class="brand-sub">PHOTOGRAPHY BY SCOTT HENRY</span>
  </a>
  <button class="menu-btn">MENU</button>
  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="work.html">Portfolio</a>
    <a class="active" href="reels.html">Reels</a>
    <a href="recent-shoots.html">Recent Events</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a class="player-link" href="player.html">Player / Client Login</a><a class="cart-link" href="cart.html">Cart <span class="cart-count" hidden>0</span></a>
    <a class="instagram instagram-link" href="https://www.instagram.com/northcountyunofficial/" target="_blank" rel="noopener" aria-label="Instagram">
      <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
        <circle cx="12" cy="12" r="4.2"></circle>
        <circle cx="17.4" cy="6.7" r="1.05" class="ig-dot"></circle>
      </svg>
      <span>Instagram</span>
    </a>
  </nav>
</header>

<main class="reels-shell">
  <section class="reels-intro">
    <div class="kicker">MOTION / BEHIND THE SHOT</div>
    <h1>REELS</h1>
    <p>Short-form highlights, behind-the-scenes moments, game action and event recaps from 31 ACTION.</p>
  </section>
  <section id="reels-grid" class="reels-public-grid">
    <div class="empty-state">Loading reels…</div>
  </section>
</main>

<script src="assets/js/api-config.js"></script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function freshReelUrl(path,attempt=0){
  const base=ActionAPI.base()+path;
  const join=base.includes('?')?'&':'?';
  return `${base}${join}play=${Date.now()}-${attempt}-${Math.random().toString(36).slice(2,8)}`;
}
function wireReelVideo(video,path){
  let retries=0;
  video.addEventListener('error',()=>{
    if(retries>=1)return;
    retries++;
    const wasTime=Number(video.currentTime)||0;
    const fresh=freshReelUrl(path,retries);
    const source=video.querySelector('source');
    if(source)source.src=fresh;
    else video.src=fresh;
    try{video.load()}catch(_){}
    video.addEventListener('loadedmetadata',()=>{
      if(wasTime>0 && Number.isFinite(video.duration)) {
        try{video.currentTime=Math.min(wasTime,Math.max(0,video.duration-.1))}catch(_){}
      }
    },{once:true});
  });
}
async function loadReels(){
  const grid=document.getElementById('reels-grid');
  try{
    const d=await ActionAPI.request('/api/reels?fresh='+Date.now());
    const rows=d.reels||[];
    if(!rows.length){
      grid.innerHTML='<div class="empty-state">Reels are coming soon.</div>';
      return;
    }
    grid.innerHTML=rows.map((r,i)=>`
      <article class="reel-card">
        <div class="reel-video-frame">
          <video controls playsinline preload="metadata" data-reel-path="${esc(r.video_url)}" ${r.poster_url?`poster="${esc(ActionAPI.base()+r.poster_url+'?v='+encodeURIComponent(r.created_at||r.id||i))}"`:''}>
            <source src="${esc(freshReelUrl(r.video_url,i))}">
          </video>
        </div>
        <div class="reel-copy">
          <div class="reel-meta">${[r.sport,r.team,r.event_label].filter(Boolean).map(esc).join(' · ')}</div>
          <h2>${esc(r.title||r.filename)}</h2>
          ${r.caption?`<p>${esc(r.caption)}</p>`:''}
          ${r.gallery_url?`<a class="button" href="${esc(r.gallery_url)}">View Related Photos</a>`:''}
        </div>
      </article>`).join('');
    grid.querySelectorAll('video[data-reel-path]').forEach(v=>wireReelVideo(v,v.dataset.reelPath));
  }catch(e){
    console.error(e);
    grid.innerHTML='<div class="empty-state">Reels could not be loaded right now.</div>';
  }
}

document.querySelector('.menu-btn')?.addEventListener('click',()=>document.querySelector('.main-nav')?.classList.toggle('open'));
loadReels();
</script>

<script>
(function(){
  const link=[...document.querySelectorAll('a[href="player.html"]')].find(a=>a.closest('.main-nav')) || document.querySelector('a[href="player.html"]');
  if(!link||!window.ActionAPI)return;
  ActionAPI.request('/api/auth/me').then(me=>{
    if(!me?.logged_in)return;
    return ActionAPI.request('/api/account/notifications');
  }).then(d=>{
    if(!d?.unread_count)return;
    let badge=link.querySelector('.account-notification-badge');
    if(!badge){
      badge=document.createElement('span');
      badge.className='account-notification-badge';
      link.appendChild(badge);
    }
    badge.textContent=String(Math.min(99,Number(d.unread_count)||0));
  }).catch(()=>{});
})();
</script>

</body>
</html>
