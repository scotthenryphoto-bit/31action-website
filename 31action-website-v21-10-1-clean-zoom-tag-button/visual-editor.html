const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats=['sports','portraits','events','other'];

const tokenEl=$('v15-token');
tokenEl.value=sessionStorage.getItem('31action_admin_token')||'';
const token=()=>String(tokenEl.value||'').trim().replace(/^Bearer\s+/i,'').trim();

let view='home';
let cloud=[],legacy=[],landing=[],recent=[],reels=[],athletes=[],pendingClaims=[],pendingAthleteRequests=[],accounts=[];
let previewDevice='desktop';
let homeSlideIndex=0;

let batchIndex=0,batchDevice='desktop',batchCrop=null,batchDirty=false,batchDrag=null,batchFullPhoto=false;

async function req(path,opt={}){
  opt.headers=Object.assign({},opt.headers||{},token()?{Authorization:`Bearer ${token()}`}:{});
  return ActionAPI.request(path,opt);
}
async function patchCloud(id,data){
  return req('/api/admin/portfolio/'+encodeURIComponent(id),{
    method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)
  });
}
async function saveLegacy(item,data){
  return req('/api/admin/portfolio-legacy-settings',{
    method:'PUT',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      source_path:item.source_path,filename:item.filename,original_category:item.original_category,
      category:data.category??item.category,hidden:data.hidden??item.hidden,
      is_cover:data.is_cover??item.is_cover,home_enabled:data.home_enabled??item.home_enabled,
      sort_order:data.sort_order??item.sort_order,
      crop_desktop:data.crop_desktop===undefined?item.crop_desktop:data.crop_desktop,
      crop_mobile:data.crop_mobile===undefined?item.crop_mobile:data.crop_mobile,
      cover_crop_desktop:data.cover_crop_desktop===undefined?item.cover_crop_desktop:data.cover_crop_desktop,
      cover_crop_mobile:data.cover_crop_mobile===undefined?item.cover_crop_mobile:data.cover_crop_mobile
    })
  });
}
async function patchSlide(id,data){
  return req('/api/admin/landing-slides/'+encodeURIComponent(id),{
    method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)
  });
}

function localItems(){
  const map=new Map(legacy.map(x=>[String(x.source_path).replace(/\\/g,'/'),x]));
  const out=[];
  for(const original_category of cats){
    (window.SITE_IMAGES?.[original_category]||[]).forEach((p,i)=>{
      const source_path=String(p).replace(/\\/g,'/');
      const s=map.get(source_path)||{};
      out.push({
        id:'local:'+source_path,local:true,source_path,src:source_path,
        filename:source_path.split('/').pop(),original_category,
        category:s.category||original_category,hidden:!!s.hidden,is_cover:!!s.is_cover,
        home_enabled:!!s.home_enabled,sort_order:Number.isFinite(+s.sort_order)?+s.sort_order:i,
        crop_desktop:s.crop_desktop||null,crop_mobile:s.crop_mobile||null,
        cover_crop_desktop:s.cover_crop_desktop||null,cover_crop_mobile:s.cover_crop_mobile||null
      });
    });
  }
  return out;
}
function allPortfolio(){
  return [
    ...cloud.map(x=>({...x,local:false,src:ActionAPI.base()+x.preview_url})),
    ...localItems()
  ].filter(x=>!x.hidden&&x.status!=='archived');
}
function catItems(cat){
  return allPortfolio().filter(x=>x.category===cat)
    .sort((a,b)=>(b.is_cover?1:0)-(a.is_cover?1:0)||(+a.sort_order||0)-(+b.sort_order||0));
}
function slideSrc(s){
  return s.source_kind==='static'?String(s.source_path||'').replace(/\\/g,'/'):
    (s.preview_url?ActionAPI.base()+s.preview_url:'');
}
function activeSlides(){return landing.filter(x=>x.enabled)}
function currentSlide(){
  const a=activeSlides();
  if(!a.length)return null;
  homeSlideIndex=Math.max(0,Math.min(a.length-1,homeSlideIndex));
  return a[homeSlideIndex];
}

async function syncLanding(){
  const paths=(window.SITE_IMAGES?.landing||[]).map(x=>String(x).replace(/\\/g,'/'));
  await req('/api/admin/landing-slides/sync',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({static_paths:paths})
  });
}
async function load(renderNow=true){
  const [p,l,ls,g,r,a,c,ar,ac]=await Promise.all([
    req('/api/admin/portfolio'),
    req('/api/admin/portfolio-legacy-settings'),
    req('/api/admin/landing-slides'),
    req('/api/admin/galleries'),
    req('/api/admin/reels'),
    req('/api/admin/athletes'),
    req('/api/admin/photo-claims?status=pending'),
    req('/api/admin/athlete-profile-requests?status=pending'),
    req('/api/admin/accounts')
  ]);
  cloud=p.items||[];
  legacy=l.items||[];
  landing=(ls.slides||[]).slice().sort((a,b)=>(+a.sort_order||0)-(+b.sort_order||0));
  recent=g.galleries||[];
  reels=(r.reels||[]).slice().sort((a,b)=>(+a.sort_order||0)-(+b.sort_order||0));
  athletes=a.athletes||[];
  pendingClaims=c.claims||[];
  pendingAthleteRequests=ar.requests||[];
  accounts=ac.accounts||[];
  $('v15-status').textContent='Connected';
  if(renderNow)render();
}

$('v15-connect').onclick=async()=>{
  try{await req('/api/admin/portfolio')}
  catch(e){$('v15-status').textContent='Token not accepted';return}
  sessionStorage.setItem('31action_admin_token',token());
  $('v15-status').textContent='Connected — loading…';
  try{await syncLanding();await load()}
  catch(e){console.error(e);$('v15-status').textContent='Connected — API error: '+e.message}
};

document.querySelectorAll('#v15-tabs button').forEach(b=>b.onclick=()=>{

});
function switchView(v){
  view=v;
  document.querySelectorAll('#v15-tabs button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));
  render();
}

/* ---------- image upload helpers ---------- */
function safeName(n){return String(n||'image.jpg').replace(/[^\w.\- ]+/g,'_')}
async function imageBitmapFor(file){
  if('createImageBitmap'in window)return createImageBitmap(file);
  return new Promise((resolve,reject)=>{
    const im=new Image(),u=URL.createObjectURL(file);
    im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};
    im.onerror=reject;im.src=u;
  });
}
async function makePreview(file,mode='none',max=2200,quality=.9){
  const img=await imageBitmapFor(file);
  const scale=Math.min(1,max/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);if(img.close)img.close();

  function stamp(text,x,y,size,alpha,angle=0){
    ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font=`900 ${size}px Arial,sans-serif`;ctx.lineWidth=Math.max(1.5,size*.045);
    ctx.strokeStyle=`rgba(0,0,0,${Math.min(.45,alpha+.1)})`;
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;ctx.strokeText(text,0,0);ctx.fillText(text,0,0);ctx.restore();
  }
  if(mode==='light'){
    const sz=Math.max(22,Math.round(Math.min(w,h)*.045));
    stamp('31 ACTION',w*.18,h*.10,sz,.26);stamp('PREVIEW',w*.82,h*.90,sz*.72,.24);
  }else if(mode==='standard'){
    const sz=Math.max(34,Math.round(Math.min(w,h)*.072));
    stamp('31 ACTION · PREVIEW',w*.5,h*.47,sz,.25,-Math.PI/18);
    stamp('31 ACTION',w*.82,h*.91,Math.max(20,Math.round(sz*.42)),.22);
  }else if(mode==='strong'){
    const sz=Math.max(26,Math.round(Math.min(w,h)*.048));
    for(let r=0;r<4;r++)for(let col=0;col<3;col++){
      const x=(col+.5)*w/3+(r%2?w/6:0);if(x>w*.97)continue;
      stamp('31 ACTION · PREVIEW',x,(r+.55)*h/4,sz,.20,-Math.PI/8);
    }
  }
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',quality));
  return {blob,width:w,height:h};
}
async function uploadPortfolioFiles(category,files,statusEl){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));
  if(!list.length)return;
  for(let i=0;i<list.length;i++){
    const f=list[i],id=`pf-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    statusEl.textContent=`Uploading ${i+1} of ${list.length}: ${f.name}`;
    const name=safeName(f.name);
    const original=await req(`/api/admin/portfolio/${encodeURIComponent(id)}/original/${encodeURIComponent(name)}`,{
      method:'PUT',headers:{'Content-Type':f.type||'image/jpeg'},body:f
    });
    const pv=await makePreview(f,'none',2400,.91);
    const previewName=name.replace(/\.(png|webp)$/i,'.jpg');
    const preview=await req(`/api/admin/portfolio/${encodeURIComponent(id)}/preview/${encodeURIComponent(previewName)}`,{
      method:'PUT',headers:{'Content-Type':'image/jpeg'},body:pv.blob
    });
    await req('/api/admin/portfolio',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id,category,filename:f.name,original_key:original.key,preview_key:preview.key,
        sort_order:catItems(category).length+i
      })
    });
  }
  statusEl.textContent=`${list.length} photo${list.length===1?'':'s'} added to ${category}.`;
  await load();
}
async function uploadGalleryFiles(galleryId,files,mode,statusEl){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp)$/i.test(f.name));
  if(!list.length)return;
  const d=await req(`/api/admin/galleries/${encodeURIComponent(galleryId)}/photos`);
  const start=(d.photos||[]).length;
  for(let i=0;i<list.length;i++){
    const f=list[i],name=safeName(f.name);
    statusEl.textContent=`Uploading ${i+1} of ${list.length}: ${f.name}`;
    const original=await req(`/api/admin/galleries/${encodeURIComponent(galleryId)}/original/${encodeURIComponent(name)}`,{
      method:'PUT',headers:{'Content-Type':f.type||'image/jpeg'},body:f
    });
    const pv=await makePreview(f,mode,1800,.86);
    const previewName=name.replace(/\.(png|webp)$/i,'.jpg');
    const preview=await req(`/api/admin/galleries/${encodeURIComponent(galleryId)}/preview/${encodeURIComponent(previewName)}`,{
      method:'PUT',headers:{'Content-Type':'image/jpeg'},body:pv.blob
    });
    await req('/api/admin/photos',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        gallery_id:galleryId,filename:f.name,original_key:original.key,preview_key:preview.key,
        width:pv.width,height:pv.height,sort_order:start+i
      })
    });
  }
  statusEl.textContent=`${list.length} photo${list.length===1?'':'s'} added.`;
  await load();
}
function wireDrop(zone,input,handler){
  zone.onclick=e=>{if(e.target!==input)input.click()};
  input.onchange=()=>handler(input.files);
  ['dragenter','dragover'].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.add('drag')}));
  ['dragleave','drop'].forEach(t=>zone.addEventListener(t,e=>{e.preventDefault();zone.classList.remove('drag')}));
  zone.addEventListener('drop',e=>handler(e.dataTransfer.files));
}

function render(){
  if(view==='home')return renderHome();
  if(view==='landing')return renderLanding();
  if(cats.includes(view))return renderCategory(view);
  if(view==='reels')return renderReels();
  if(view==='athletes')return renderAthletes();
  if(view==='accounts')return renderAccounts();
  if(view==='rosters')return renderRosters();
  if(view==='reports')return renderReports();
  if(view==='tags')return renderTags();
  if(view==='recent')return renderRecent();
}

  requestAnimationFrame(()=>{

function targetAspect(device){return device==='mobile'?0.58:2.75}
function defaultCrop(){return{x:0,y:0,w:100,h:100,excluded:false}}
function getSlideCrop(s,device){return JSON.parse(JSON.stringify((device==='mobile'?s.crop_mobile:s.crop_desktop)||defaultCrop()))}
function normalizeCrop(c,nw,nh,ratio){
  let x=+c.x||0,y=+c.y||0,w=Math.max(8,+c.w||100),h=Math.max(8,+c.h||100);
  const cx=x+w/2,cy=y+h/2;
  let wantH=(nw*w)/(nh*ratio);
  if(wantH<=100)h=wantH;
  else{h=100;w=(nh*h*ratio)/nw}
  w=Math.min(100,w);h=Math.min(100,h);
  x=Math.max(0,Math.min(100-w,cx-w/2));y=Math.max(0,Math.min(100-h,cy-h/2));
  return{x,y,w,h,excluded:!!c.excluded};
}

let dualDesktopDrag=null,dualPhonePan=null;

function wireLandingUpload(){
  const zone=$('landing-drop'),input=$('landing-files'),status=$('landing-upload-status');
  if(!zone||!input)return;
  wireDrop(zone,input,async files=>{
    try{
      const cat=$('landing-upload-category')?.value||'other';
      const before=new Set(cloud.map(x=>x.id));
      await uploadPortfolioFiles(cat,files,status);
      // uploadPortfolioFiles reloads data; add only newly uploaded cloud items to slideshow.
      const added=cloud.filter(x=>!before.has(x.id));
      for(const x of added){
        await req('/api/admin/landing-slides/portfolio',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({portfolio_id:x.id})
        });
      }
      status.textContent=`${added.length} photo${added.length===1?'':'s'} added to portfolio and landing slideshow.`;
      await load(false);
      if(added.length)batchIndex=Math.max(0,landing.length-added.length);
      renderLanding();
    }catch(e){status.textContent='Upload stopped: '+e.message}
  });
}

function desktopImageRect(){
  const stage=$('dual-desktop-stage'),img=$('dual-desktop-source'),r=stage.getBoundingClientRect();
  const nw=img.naturalWidth||1,nh=img.naturalHeight||1,sc=Math.min(r.width/nw,r.height/nh),w=nw*sc,h=nh*sc;
  return{left:(r.width-w)/2,top:(r.height-h)/2,width:w,height:h}
}
function desktopPct(e){
  const sr=$('dual-desktop-stage').getBoundingClientRect(),r=desktopImageRect();
  return{x:Math.max(0,Math.min(100,(e.clientX-sr.left-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-sr.top-r.top)/r.height*100))}
}
function setupDesktopCropDrag(){
  const box=$('dual-desktop-box');if(!box)return;
  box.onpointerdown=e=>{
    e.preventDefault();
    e.stopPropagation();
    box.setPointerCapture?.(e.pointerId);
    dualDesktopDrag={
      resize:e.target.tagName==='I',
      start:desktopPct(e),
      orig:{...dualDesktopCrop},
      pointerId:e.pointerId
    };
  };
  box.onpointermove=e=>{
    if(!dualDesktopDrag)return;
    dualDesktopMove(e);
  };
  box.onpointerup=box.onpointercancel=e=>{
    try{box.releasePointerCapture?.(e.pointerId)}catch(_){}
    dualDesktopDrag=null;
  };
}
function dualDesktopMove(e){
  if(!dualDesktopDrag||view!=='landing')return;
  const p=desktopPct(e),dx=p.x-dualDesktopDrag.start.x,dy=p.y-dualDesktopDrag.start.y,o=dualDesktopDrag.orig,n={...o};
  if(dualDesktopDrag.resize){
    const img=$('dual-desktop-source'),nw=img.naturalWidth||1,nh=img.naturalHeight||1,R=targetAspect('desktop');
    let w=Math.max(8,Math.min(100-o.x,o.w+dx)),h=(nw*w)/(nh*R);
    if(h>100-o.y){h=100-o.y;w=(nh*h*R)/nw}
    n.w=w;n.h=h;
  }else{
    n.x=Math.max(0,Math.min(100-o.w,o.x+dx));n.y=Math.max(0,Math.min(100-o.h,o.y+dy));
  }
  dualDesktopCrop=n;dualDesktopDirty=true;renderDualDesktop();
}
function renderDualDesktop(){
  const b=$('dual-desktop-box'),img=$('dual-desktop-source'),preview=$('dual-desktop-preview');
  if(!b||!img)return;
  const r=desktopImageRect(),c=dualDesktopCrop;
  b.style.display=c.excluded?'none':'block';
  b.style.left=(r.left+r.width*c.x/100)+'px';b.style.top=(r.top+r.height*c.y/100)+'px';
  b.style.width=(r.width*c.w/100)+'px';b.style.height=(r.height*c.h/100)+'px';
  $('desktop-save-state').textContent=dualDesktopDirty?'Unsaved Desktop changes':'Saved / unchanged';
  if(c.excluded){preview.style.visibility='hidden'}
  else{
    preview.style.visibility='';
    ActionPortfolio.renderCropInto(preview,{src:slideSrc(landing[batchIndex])},c,true).catch(()=>{});
  }
}
function phoneCoverDimensions(){
  const img=$('dual-phone-source');
  const nw=img?.naturalWidth||1,nh=img?.naturalHeight||1;
  const imageAspect=nw/nh;
  const target=targetAspect('mobile');

  // Source rectangle that exactly matches the phone viewport at "Fill".
  if(imageAspect>target){
    return {w:100*target/imageAspect,h:100};
  }else{
    return {w:100,h:100*imageAspect/target};
  }
}

function inferPhoneFramingFromCrop(c){
  const cover=phoneCoverDimensions();
  const w=Math.max(1,+c.w||100),h=Math.max(1,+c.h||100);

  if(w>=99 && h>=99)return 0;

  // Before Fill: one dimension remains near 100 while the other moves
  // continuously from 100 toward the exact-cover dimension.
  if(cover.w<99 && h>=98){
    const denom=Math.max(.001,100-cover.w);
    return Math.max(0,Math.min(100,((100-w)/denom)*100));
  }
  if(cover.h<99 && w>=98){
    const denom=Math.max(.001,100-cover.h);
    return Math.max(0,Math.min(100,((100-h)/denom)*100));
  }

  // At/after Fill: crop keeps phone aspect and shrinks for extra zoom.
  const zw=cover.w/w;
  const zh=cover.h/h;
  const z=Math.max(1,Math.min(2,Math.max(zw,zh)));
  return Math.round(z*100);
}

function initDualPhoneFromSaved(){
  const c=dualPhoneCrop||defaultCrop();
  const focusX=Math.max(0,Math.min(100,(+c.x||0)+(+c.w||100)/2));
  const focusY=Math.max(0,Math.min(100,(+c.y||0)+(+c.h||100)/2));
  const amount=inferPhoneFramingFromCrop(c);

  dualPhoneState={
    amount,
    focusX,
    focusY
  };

  const slider=$('dual-phone-zoom');
  if(slider)slider.value=String(amount);
}

function framingLabel(amount){
  amount=+amount||0;
  if(amount<=2)return 'Fit entire photo';
  if(amount<98)return `${Math.round(amount)}% toward Fill`;
  if(amount<=102)return 'Fill screen';
  return `${(amount/100).toFixed(2)}× beyond Fill`;
}

function syncDualPhoneRect(){
  const cover=phoneCoverDimensions();
  const amount=Math.max(0,Math.min(200,+dualPhoneState.amount||0));

  let w,h;

  if(amount<=100){
    // Continuous interpolation from the complete image (100 x 100)
    // to the exact phone-aspect crop. This is what removes the old jump.
    const t=amount/100;
    w=100+(cover.w-100)*t;
    h=100+(cover.h-100)*t;
  }else{
    // Beyond Fill, preserve phone aspect and zoom further.
    const factor=amount/100;  // 1.00 at Fill, 2.00 at far-right
    w=cover.w/factor;
    h=cover.h/factor;
  }

  w=Math.max(3,Math.min(100,w));
  h=Math.max(3,Math.min(100,h));

  const x=Math.max(0,Math.min(100-w,dualPhoneState.focusX-w/2));
  const y=Math.max(0,Math.min(100-h,dualPhoneState.focusY-h/2));

  dualPhoneCrop={
    x,y,w,h,
    excluded:dualPhoneCrop.excluded
  };
}

function setupPhoneCropDragZoom(){
  const stage=$('dual-phone-stage'),slider=$('dual-phone-zoom');
  if(!stage||!slider)return;

  slider.value=String(dualPhoneState.amount||0);
  $('dual-phone-zoom-value').textContent=framingLabel(slider.value);

  slider.oninput=()=>{
    dualPhoneState.amount=+slider.value;
    syncDualPhoneRect();
    dualPhoneDirty=true;
    renderDualPhone();
  };

  stage.onpointerdown=e=>{
    e.preventDefault();
    e.stopPropagation();
    stage.setPointerCapture?.(e.pointerId);
    dualPhonePan={
      x:e.clientX,y:e.clientY,
      focusX:dualPhoneState.focusX,
      focusY:dualPhoneState.focusY
    };
  };

  stage.onpointermove=e=>{
    if(!dualPhonePan)return;
    const r=stage.getBoundingClientRect();
    const dx=(e.clientX-dualPhonePan.x)/Math.max(1,r.width)*100;
    const dy=(e.clientY-dualPhonePan.y)/Math.max(1,r.height)*100;

    dualPhoneState.focusX=Math.max(0,Math.min(100,dualPhonePan.focusX-dx));
    dualPhoneState.focusY=Math.max(0,Math.min(100,dualPhonePan.focusY-dy));

    syncDualPhoneRect();
    dualPhoneDirty=true;
    renderDualPhone();
  };

  stage.onpointerup=stage.onpointercancel=()=>dualPhonePan=null;
}

function renderDualPhone(){
  const source=$('dual-phone-source'),preview=$('dual-phone-preview'),c=dualPhoneCrop;
  if(!source)return;

  const slider=$('dual-phone-zoom');
  if(slider){
    slider.value=String(dualPhoneState.amount||0);
    $('dual-phone-zoom-value').textContent=framingLabel(slider.value);
  }

  $('phone-save-state').textContent=dualPhoneDirty?'Unsaved Phone changes':'Saved / unchanged';

  if(c.excluded){
    source.style.visibility='hidden';
    preview.style.visibility='hidden';
  }else{
    source.style.visibility='';
    preview.style.visibility='';

    // ALWAYS contain the selected source rectangle. This lets the slider
    // smoothly retain some black bars between Fit and Fill.
    ActionPortfolio.renderCropInto(
      source,
      {src:slideSrc(landing[batchIndex])},
      c,
      true
    ).catch(()=>{});

    ActionPortfolio.renderCropInto(
      preview,
      {src:slideSrc(landing[batchIndex])},
      c,
      true
    ).catch(()=>{});
  }
}

async function makeReelPoster(file){
  const url=URL.createObjectURL(file);
  try{
    const video=document.createElement('video');
    video.muted=true;video.playsInline=true;video.preload='metadata';
    await new Promise((resolve,reject)=>{
      const timer=setTimeout(()=>reject(new Error('Poster frame timed out')),10000);
      video.onloadedmetadata=()=>{
        clearTimeout(timer);
        try{video.currentTime=Math.min(.5,Math.max(.01,(video.duration||1)*.05))}catch(_){resolve()}
      };
      video.onseeked=resolve;
      video.onerror=()=>reject(new Error('Browser could not preview this video'));
      video.src=url;
    });
    const w=video.videoWidth||720,h=video.videoHeight||1280;
    const max=1200,scale=Math.min(1,max/Math.max(w,h));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w*scale));c.height=Math.max(1,Math.round(h*scale));
    c.getContext('2d').drawImage(video,0,0,c.width,c.height);
    return await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',.88));
  }finally{URL.revokeObjectURL(url)}
}
async function uploadReels(files,status){

  const sport=$('reel-upload-sport')?.value||'';

  const eventLabel=$('reel-upload-event')?.value||'';
  const related=$('reel-upload-gallery')?.value||'';
  for(let i=0;i<list.length;i++){
    const f=list[i];
    const id=`reel-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    const filename=safeName(f.name);
    status.textContent=`Uploading reel ${i+1} of ${list.length}: ${f.name}`;
    const videoRes=await req(`/api/admin/reels/${encodeURIComponent(id)}/video/${encodeURIComponent(filename)}`,{
      method:'PUT',headers:{'Content-Type':f.type||'video/mp4'},body:f
    });
    let posterKey=null;
    try{
      status.textContent=`Creating poster frame: ${f.name}`;
      const poster=await makeReelPoster(f);
      if(poster){
        const posterName=filename.replace(/\.(mp4|webm)$/i,'-poster.jpg');
        const pr=await req(`/api/admin/reels/${encodeURIComponent(id)}/poster/${encodeURIComponent(posterName)}`,{
          method:'PUT',headers:{'Content-Type':'image/jpeg'},body:poster
        });
        posterKey=pr.key;
      }
    }catch(e){console.warn('Poster frame skipped',e)}
    await req('/api/admin/reels',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        id,
        title:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),
        filename:f.name,
        video_key:videoRes.key,
        poster_key:posterKey,
        sort_order:reels.length+i,
        sport,team,event_label:eventLabel,
        related_gallery_id:related||null
      })
    });
  }
  status.textContent=`${list.length} reel${list.length===1?'':'s'} uploaded.`;
  await load();
}

      });

    };
  });
}
async function moveReel(i,dir){
  const j=i+dir;if(j<0||j>=reels.length)return;
  [reels[i],reels[j]]=[reels[j],reels[i]];
  for(let k=0;k<reels.length;k++){
    await req('/api/admin/reels/'+encodeURIComponent(reels[k].id),{
      method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({sort_order:k*10})
    });
  }
  await load(false);renderReels();
}

function wireAccountCards(root){
  root.querySelectorAll('.v19-account-card').forEach(card=>{
    const uid=card.dataset.user;
    card.querySelector('.load-client-access').onclick=()=>loadEntitlements(card,uid);

    card.querySelector('.grant-client-access').onclick=async()=>{
      const gid=card.querySelector('.client-gallery-select').value;
      if(!gid)return alert('Choose a gallery.');
      const msg=card.querySelector('.v20-account-message');
      try{
        msg.textContent='Granting access…';
        await req(`/api/admin/accounts/${encodeURIComponent(uid)}/gallery-entitlements`,{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            gallery_id:gid,
            can_download_all:card.querySelector('.client-download').checked,
            can_order_prints:card.querySelector('.client-prints').checked
          })
        });
        msg.textContent='Gallery access saved.';
        await loadEntitlements(card,uid);
      }catch(e){msg.textContent=e.message}
    };

    const deactivate=card.querySelector('.account-deactivate');
    if(deactivate) deactivate.onclick=async()=>{
      if(!confirm('Deactivate this account? The user will not be able to log in until you reactivate it.'))return;
      const msg=card.querySelector('.v20-account-message');
      try{
        msg.textContent='Deactivating…';
        await req(`/api/admin/accounts/${encodeURIComponent(uid)}/deactivate`,{method:'POST'});
        msg.textContent='Account deactivated.';
        await load();
      }catch(e){msg.textContent=e.message}
    };

    const reactivate=card.querySelector('.account-reactivate');
    if(reactivate) reactivate.onclick=async()=>{
      const msg=card.querySelector('.v20-account-message');
      try{
        msg.textContent='Reactivating…';
        await req(`/api/admin/accounts/${encodeURIComponent(uid)}/reactivate`,{method:'POST'});
        msg.textContent='Account reactivated.';
        await load();
      }catch(e){msg.textContent=e.message}
    };

    card.querySelector('.account-delete').onclick=async()=>{
      const label=card.querySelector('.v19-account-head strong')?.textContent||'this account';
      if(!confirm(`Delete ${label}? This permanently removes the login and related account data. Accounts with purchase history cannot be deleted.`))return;
      if(!confirm('Are you sure? This cannot be undone.'))return;
      const msg=card.querySelector('.v20-account-message');
      try{
        msg.textContent='Deleting account…';
        await req(`/api/admin/accounts/${encodeURIComponent(uid)}`,{method:'DELETE'});
        msg.textContent='Account deleted.';
        await load();
      }catch(e){
        msg.textContent=e.message;
        if(/purchase history/i.test(e.message||'')){
          msg.innerHTML=`<strong>Delete blocked:</strong> ${esc(e.message)} Use Deactivate instead.`;
        }
      }
    };
  });
}

function dateInputValue(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function reportPreset(name){
  const now=new Date();
  let start=new Date(now.getFullYear(),now.getMonth(),1),end=new Date(now);
  if(name==='today'){start=new Date(now.getFullYear(),now.getMonth(),now.getDate());}
  if(name==='7days'){start=new Date(now);start.setDate(start.getDate()-6);}
  if(name==='lastmonth'){
    start=new Date(now.getFullYear(),now.getMonth()-1,1);
    end=new Date(now.getFullYear(),now.getMonth(),0);
  }
  if(name==='year'){start=new Date(now.getFullYear(),0,1);}
  $('report-start').value=dateInputValue(start);
  $('report-end').value=dateInputValue(end);
  runReport();
}

        if(!label)return;
        await req('/api/admin/photos/'+encodeURIComponent(card.dataset.photo)+'/tags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label,tag_type})});
        card.querySelector('.pt-label').value='';
        await loadPhotoTags(card,gid);
      };
    }
  }catch(e){msg.textContent='Could not load tagging tools: '+e.message}
}
async function loadPhotoTags(card,gid){
  const d=await req('/api/admin/photos/'+encodeURIComponent(card.dataset.photo)+'/tags');
  const chips=card.querySelector('.pt-chips');
  chips.innerHTML=(d.tags||[]).map(t=>`<button class="v18-tag-chip" data-tag="${esc(t.tag_id)}" title="Click to remove"><b>${esc(t.tag_type)}</b> ${esc(t.label)} ×</button>`).join('')||'<span class="mini-note">No tags.</span>';
  chips.querySelectorAll('.v18-tag-chip').forEach(ch=>ch.onclick=async()=>{
    await req('/api/admin/photos/'+encodeURIComponent(card.dataset.photo)+'/tags/'+encodeURIComponent(ch.dataset.tag),{method:'DELETE'});
    await loadPhotoTags(card,gid);
  });
}

}

/* ---------- cover crop ---------- */
function openCoverCrop(x,device='desktop'){
  coverTarget=x;coverDevice=device;
  coverState={
    desktop:JSON.parse(JSON.stringify(x.cover_crop_desktop||defaultCrop())),
    mobile:JSON.parse(JSON.stringify(x.cover_crop_mobile||defaultCrop()))
  };
  $('cover-name').textContent=x.filename;
  $('cover-source').onload=()=>requestAnimationFrame(renderCoverCrop);
  $('cover-source').src=x.src;$('cover-preview-image').src=x.src;
  $('cover-modal').hidden=false;
  document.querySelectorAll('[data-cover-device]').forEach(b=>b.classList.toggle('active',b.dataset.coverDevice===device));
  renderCoverCrop();
}
function coverCurrent(){return coverState[coverDevice]||defaultCrop()}
function coverImageRect(){
  const stage=$('cover-stage'),img=$('cover-source'),r=stage.getBoundingClientRect(),nw=img.naturalWidth||1,nh=img.naturalHeight||1,sc=Math.min(r.width/nw,r.height/nh),w=nw*sc,h=nh*sc;
  return{left:(r.width-w)/2,top:(r.height-h)/2,width:w,height:h}
}
function coverPct(e){
  const sr=$('cover-stage').getBoundingClientRect(),r=coverImageRect();
  return{x:Math.max(0,Math.min(100,(e.clientX-sr.left-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-sr.top-r.top)/r.height*100))}
}
function renderCoverCrop(){
  if(!coverTarget)return;
  const c=coverCurrent(),r=coverImageRect(),box=$('cover-box');
  box.style.left=(r.left+r.width*c.x/100)+'px';box.style.top=(r.top+r.height*c.y/100)+'px';
  box.style.width=(r.width*c.w/100)+'px';box.style.height=(r.height*c.h/100)+'px';
  requestAnimationFrame(()=>ActionPortfolio.renderCropInto($('cover-preview-image'),coverTarget,c,true).catch(()=>{}));
}
$('cover-box').onpointerdown=e=>{e.preventDefault();coverDrag={resize:e.target.tagName==='I',start:coverPct(e),orig:{...coverCurrent()}}};
window.addEventListener('pointermove',e=>{
  if(!coverDrag)return;
  const p=coverPct(e),dx=p.x-coverDrag.start.x,dy=p.y-coverDrag.start.y,o=coverDrag.orig,n={...o};
  if(coverDrag.resize){n.w=Math.max(8,Math.min(100-o.x,o.w+dx));n.h=Math.max(8,Math.min(100-o.y,o.h+dy))}
  else{n.x=Math.max(0,Math.min(100-o.w,o.x+dx));n.y=Math.max(0,Math.min(100-o.h,o.y+dy))}
  coverState[coverDevice]=n;renderCoverCrop();
});
window.addEventListener('pointerup',()=>coverDrag=null);
document.querySelectorAll('[data-cover-device]').forEach(b=>b.onclick=()=>{coverDevice=b.dataset.coverDevice;document.querySelectorAll('[data-cover-device]').forEach(x=>x.classList.toggle('active',x===b));renderCoverCrop()});
$('cover-reset').onclick=()=>{coverState[coverDevice]=defaultCrop();renderCoverCrop()};
$('cover-close').onclick=()=>$('cover-modal').hidden=true;
$('cover-save').onclick=async()=>{
  if(!coverTarget)return;
  const data={cover_crop_desktop:coverState.desktop,cover_crop_mobile:coverState.mobile};
  if(coverTarget.local)await saveLegacy(coverTarget,data);else await patchCloud(coverTarget.id,data);
  $('cover-modal').hidden=true;await load();
};

/* keyboard shortcuts */
window.addEventListener('keydown',e=>{
  if(view!=='landing'||!landing.length)return;
  if(e.ctrlKey&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    saveBothDeviceCrops();
    return;
  }
  if(e.target&&['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key==='ArrowRight'){batchIndex=(batchIndex+1)%landing.length;renderLanding()}
  if(e.key==='ArrowLeft'){batchIndex=(batchIndex-1+landing.length)%landing.length;renderLanding()}
});

if(token())$('v15-connect').click();
</script>
