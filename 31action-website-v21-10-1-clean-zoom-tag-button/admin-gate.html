<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Access | 31 ACTION</title><link rel="stylesheet" href="assets/css/styles.css"></head><body class="admin-gate-body">
<div class="admin-gate-card">
<a class="brand" href="index.html"><span class="brand-main"><span class="n">31</span><span class="a">ACTION</span></span><span class="brand-sub">ADMIN ACCESS</span></a>
<h1>Owner Sign In</h1>
<p>Enter your 31 ACTION admin token to continue.</p>
<label>Admin token<input id="gate-token" type="password" autocomplete="off"></label>
<button id="gate-enter" class="primary-btn">Enter Admin</button>
<div id="gate-status" class="mini-note"></div>
<a class="button" href="index.html">Back to Website</a>
</div>
<script src="assets/js/api-config.js"></script><script>
const t=document.getElementById('gate-token'),s=document.getElementById('gate-status');
t.value=sessionStorage.getItem('31action_admin_token')||'';
function token(){return String(t.value||'').trim().replace(/^Bearer\s+/i,'').trim()}
async function go(){if(!token()){s.textContent='Enter your token first.';return}try{await ActionAPI.request('/api/admin/access-grants',{headers:{Authorization:`Bearer ${token()}`}});sessionStorage.setItem('31action_admin_token',token());location.href='admin.html'}catch(e){s.textContent='Token not accepted.'}}
document.getElementById('gate-enter').onclick=go;t.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
